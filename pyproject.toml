[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-group-bot"
version = "0.1.0"
description = "Telegram group AI chat bot using Telegram Bot API and OpenAI"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.93.0,<2.0.0"
]

[project.scripts]
telegram-group-bot = "group_chat_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
